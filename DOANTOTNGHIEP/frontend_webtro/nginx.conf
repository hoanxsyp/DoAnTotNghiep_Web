# =====================================================================
#  Nginx - phuc vu SPA + reverse proxy sang backend
#  Ten host `backend` la ten service trong docker-compose (khong hardcode IP).
# =====================================================================

upstream webtro_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 60m;

    # ----------------------------- Bao mat --------------------------
    server_tokens off;
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "0"              always;
    add_header Permissions-Policy      "geolocation=(self), microphone=(), camera=()" always;

    # ------------------------------ Gzip ----------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # --------------------------- Healthcheck -------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ------------------------- Reverse proxy API ---------------------
    location /api/ {
        proxy_pass         http://webtro_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Khong buffer de tai anh lon khong an het RAM cua Nginx.
        proxy_request_buffering off;
    }

    # ------------------------- Reverse proxy WebSocket ----------------
    location /ws/ {
        proxy_pass         http://webtro_backend;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "Upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    1h;
    }

    # Swagger UI cua backend, tien cho viec cham diem do an.
    location ~ ^/(swagger-ui|v3/api-docs|actuator)(/|$) {
        proxy_pass         http://webtro_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ----------------------- Tai nguyen bam van tay -------------------
    # Vite sinh ten file co hash -> cache vinh vien an toan.
    location ^~ /assets/ {
        try_files $uri @asset_not_found;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location @asset_not_found {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html KHONG duoc cache, neu khong nguoi dung se ket dinh o
    # ban build cu va tro toi file assets da bi xoa.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # --------------------------- SPA fallback ------------------------
    # Moi route cua React Router deu tra ve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
