<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Thông báo</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,'Helvetica Neue',sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;max-width:600px;width:100%;">
                <tr>
                    <td style="background:#0f766e;padding:24px 32px;">
                        <span style="color:#ffffff;font-size:20px;font-weight:bold;">Webtro</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 style="margin:0 0 16px;font-size:20px;color:#0f172a;" th:text="${title}">Thông báo</h1>
                        <p style="margin:0 0 24px;color:#334155;line-height:1.6;" th:text="${content}">
                            Nội dung thông báo.
                        </p>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;"
                               th:if="${actionUrl != null}">
                            <tr>
                                <td style="border-radius:8px;background:#0f766e;">
                                    <a th:href="${actionUrl}" href="#"
                                       style="display:inline-block;padding:12px 28px;color:#ffffff;
                                              text-decoration:none;font-weight:bold;font-size:15px;"
                                       th:text="${actionLabel} ?: 'Xem chi tiết'">Xem chi tiết</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px;background:#f8fafc;color:#94a3b8;font-size:12px;">
                        © Webtro — Bạn nhận được email này vì đã đăng ký tài khoản Webtro.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
